# Bootstrap config — HTTP only, used once so certbot can issue the first
# certificate. The real config references /etc/letsencrypt/live/... which does
# not exist yet, and nginx refuses to start when an ssl_certificate path is
# missing, so it cannot be installed first.
#
# Install this, get the cert, then swap in nginx-chax.nexarrow.eu.conf.

server {
    listen 80;
    listen [::]:80;
    server_name chax.nexarrow.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
