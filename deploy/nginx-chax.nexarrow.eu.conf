# NexChat — chax.nexarrow.eu
#
# Everything is served from one origin: the browser talks only to
# https://chax.nexarrow.eu, so there are no cross-origin requests and no CORS
# preflight on the hot path. `NEXT_PUBLIC_API_URL` must match this origin,
# because the frontend derives its API base, its socket URL, and every
# attachment URL from that one value.
#
# Ports are 3100/5100, NOT 3000/5000 — splitta already runs on this box and
# the defaults would collide. Check before you enable this:
#     sudo ss -tlnp | grep -E ':(3000|3100|5000|5100)'

# Named for this app so it cannot clash with a map of the same name in
# splitta's config — nginx refuses to start on a duplicate.
map $http_upgrade $nexchat_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chax.nexarrow.eu;

    # Certbot renewals must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chax.nexarrow.eu;

    ssl_certificate     /etc/letsencrypt/live/chax.nexarrow.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chax.nexarrow.eu/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Must exceed MAX_UPLOAD_MB (50) or large attachments 413 at the proxy
    # before Express ever sees them.
    client_max_body_size 60m;

    access_log /var/log/nginx/nexchat.access.log;
    error_log  /var/log/nginx/nexchat.error.log;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── API ──
    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_read_timeout 120s;
    }

    # ── attachments ──
    # Served straight off disk rather than through Node. These are encrypted
    # blobs and are already public-by-URL by design, so nginx can hand them
    # over without waking the app.
    location /uploads/ {
        alias /var/www/nexchat-data/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # The app fetches these from its own origin, but keep the header so a
        # linked device on another host can still load them.
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri =404;
    }

    # ── realtime ──
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $nexchat_upgrade;
        # A websocket that is merely idle must not be culled.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ── Next.js ──
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $nexchat_upgrade;
    }
}
